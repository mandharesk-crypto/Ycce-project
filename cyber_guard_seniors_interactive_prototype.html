    /* Accessibility Modes */
    .a11y-large-text {
      font-size: 112%;
    }
    .a11y-large-text p,
    .a11y-large-text li,
    .a11y-large-text span,
    .a11y-large-text textarea,
    .a11y-large-text input {
      line-height: 1.5;
    }
    .a11y-high-contrast {

    /* Custom scrollbar inside phone screen */

      width: 5px;
    }
    .phone-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .phone-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    /* Speaking waveform animation */
    @keyframes wave {
      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    .wave-bar {
      animation: wave 0.75s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }

    /* OS Push Banner Slide Down */
    @keyframes osBannerIn {
      0% { opacity: 0; transform: translateY(-110%); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .os-banner-enter {
      animation: osBannerIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Incoming Call Vibrate / Ring Pulse */
    @keyframes phoneVibrate {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-10deg) scale(1.05); }
      40% { transform: rotate(10deg) scale(1.05); }
      60% { transform: rotate(-8deg) scale(1.03); }
      80% { transform: rotate(8deg) scale(1.03); }
    }
    .ring-vibrate {
      animation: phoneVibrate 0.7s ease-in-out infinite;
    }

    /* Shield Pulse on Splash */
    @keyframes shieldPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
      50% { transform: scale(1.06); box-shadow: 0 0 0 18px rgba(245, 158, 11, 0); }
    }
    .splash-pulse {
      animation: shieldPulse 1.6s infinite;
    }

    // =========================================================================
    // 1. WEB AUDIO API SYNTHESIZER (Native Sound Effects — Zero External Files)
    // =========================================================================
    let audioCtx = null;
    let ringInterval = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!state.soundEnabled) return;
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;

      if (type === "tap") {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(280, now + 0.045);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === "success") {
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.11);
          gain.gain.setValueAtTime(0.14, now + idx * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.11);
          osc.stop(now + idx * 0.11 + 0.36);
        });
      } else if (type === "alert") {
        [440, 349.23, 440].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(freq, now + idx * 0.16);
          gain.gain.setValueAtTime(0.12, now + idx * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.16 + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.16);
          osc.stop(now + idx * 0.16 + 0.15);
        });
      } else if (type === "notification") {
        [880, 1174.66].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(0.1, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.23);
        });
      }
    }

    function startIncomingRingtone() {
      stopIncomingRingtone();
      if (!state.soundEnabled) return;
      const pulse = () => {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        [620, 740, 620, 740].forEach((f, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(f, now + i * 0.12);
          gain.gain.setValueAtTime(0.09, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.11);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.12);
        });
      };
      pulse();
      ringInterval = setInterval(pulse, 1800);
    }

    function stopIncomingRingtone() {
      if (ringInterval) {
        clearInterval(ringInterval);
        ringInterval = null;
      }
    }

      return { ...defaultState };

      setTimeout(() => {

    // =========================================================================
    // 7. VOICE NARRATION (Web Speech API) & OS PUSH NOTIFICATIONS
    // =========================================================================
    function speakText(text) {
      if (!("speechSynthesis" in window)) {
        showOsPushNotification("Voice Guide", text);
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = state.lang === "hi" ? "hi-IN" : state.lang === "mr" ? "mr-IN" : "en-IN";
      utterance.rate = 0.92;
      utterance.onstart = () => {
        state.isSpeaking = true;
        render();
      };
      utterance.onend = () => {
        state.isSpeaking = false;
        render();
      };
      utterance.onerror = () => {
        state.isSpeaking = false;
        render();
      };

    function analyzeMessageText(rawText) {
      const text = (rawText || "").trim();
      if (!text) return;
      const lower = text.toLowerCase();
      const redKeywords = ["bit.ly", "tinyurl", "kyc", "otp", "blocked", "freeze", "lottery", "won", "upi pin", ".apk", "disconnect", "arrest", "cbi"];
      const warnKeywords = ["urgent", "click", "link", "verify", "refund", "cashback", "prize"];

      const matchedRed = redKeywords.filter((k) => lower.includes(k));
      const matchedWarn = warnKeywords.filter((k) => lower.includes(k));

      if (matchedRed.length > 0) {
        playSound("alert");
        state.checkerResult = {
          level: "scam",
          reasons: {
            en: [
              `High-risk scam keywords detected (${matchedRed.slice(0, 3).join(", ")}).`,
              "Creates false urgency to trick you into sharing OTP, PIN, or installing malware.",
              "Do NOT click links or reply. Tap 1930 or Ask Family First."
            ],
            hi: [
              `खतरनाक स्कैम शब्द पाए गए (${matchedRed.slice(0, 3).join(", ")})।`,
              "यह संदेश घबराहट पैदा करके आपका OTP या PIN चुराने की कोशिश कर रहा है।",
              "किसी लिंक पर क्लिक न करें। तुरंत 1930 पर कॉल करें या परिवार से पूछें।"
            ],
            mr: [
              `धोकादायक स्कॅम शब्द आढळले (${matchedRed.slice(0, 3).join(", ")}).`,
              "भीती दाखवून तुमचा OTP किंवा UPI PIN चोरण्याचा हा प्रयत्न आहे.",
              "कोणत्याही लिंकवर क्लिक करू नका. १९३० वर कॉल करा किंवा कुटुंबाला विचारा."
            ]
          }
        };
        logFamilyAlert("HIGH", `Blocked scam text containing: ${matchedRed.slice(0, 2).join(", ")}`);
      } else if (matchedWarn.length > 0) {
        playSound("alert");
        state.checkerResult = {
          level: "warn",
          reasons: {
            en: [
              "Message asks for urgent verification or link action.",
              "Call your official bank branch directly before taking any step."
            ],
            hi: [
              "संदेश में तुरंत कार्रवाई या लिंक पर जाने को कहा गया है।",
              "कोई भी कदम उठाने से पहले अपनी बैंक शाखा को सीधे कॉल करें।"
            ],
            mr: [
              "मेसेजमध्ये तातडीने लिंक उघडण्यास सांगितले आहे.",
              "कोणतीही कृती करण्यापूर्वी थेट तुमच्या बँक शाखेशी संपर्क साधा."
            ]
          }
        };
      } else {
        playSound("success");
        state.checkerResult = {
          level: "safe",
          reasons: {
            en: [
              "No phishing links, APK files, or OTP/PIN demands found.",
              "Matches standard informational banking notifications."
            ],
            hi: [
              "इसमें कोई संदिग्ध लिंक, APK फाइल या OTP/PIN की मांग नहीं है।",
              "यह एक सामान्य सूचनात्मक बैंक संदेश जैसा दिखता है।"
            ],
            mr: [
              "यामध्ये कोणतीही संशयास्पद लिंक, APK फाईल किंवा OTP/PIN ची मागणी नाही.",
              "हा एक सामान्य माहितीपूर्ण बँक संदेश दिसत आहे."
            ]
          }
        };
      }
      render();
    }

    function analyzeUpiOrPhone(rawVal) {
      const val = (rawVal || "").trim();
      if (!val) return;
      const lower = val.toLowerCase();
      const suspiciousUpi = ["refund", "cashback", "prize", "lottery", "kyc", "helpdesk", "customercare", "offer", "reward"];
      const hit = suspiciousUpi.find((w) => lower.includes(w));

            ],

    async function handleScreenshotUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      playSound("tap");
      state.ocrStatus = "Scanning screenshot with Tesseract OCR...";
      render();

      try {
        if (window.Tesseract) {
          const res = await window.Tesseract.recognize(file, "eng");
          const extracted = (res.data && res.data.text ? res.data.text : "").replace(/\s+/g, " ").trim();
          state.ocrStatus = "";
          if (extracted.length > 5) {
            state.checkerInput = extracted;
            analyzeMessageText(extracted);
            return;
          }
        }
      } catch (err) {
        console.warn("OCR fallback triggered", err);
      }

      // Clean fallback if image has low text contrast
      state.ocrStatus = "";
      state.checkerInput = "Scanned Screenshot: URGENT KYC Pending! Tap bit.ly/kyc-update to avoid account block.";
      analyzeMessageText(state.checkerInput);
    }

            </div>
          </div>
        `;
      }

      // -----------------------------------------------------------------------
      // SCREEN 6: COMPLETE BULLET-POINT FEATURES DIRECTORY
      // -----------------------------------------------------------------------
      else if (state.screen === "features") {
        container.innerHTML = `
          <div>
            <h2 class="text-xl font-bold text-slate-900">${t.featuresHeader}</h2>
            <p class="text-xs text-slate-600 mt-0.5">${t.featuresDesc}</p>
          </div>

          <div class="space-y-3.5">
            ${bulletFeatureGroups
              .map(
                (grp) => `
              <div class="hc-card bg-white rounded-3xl p-4 border-2 border-slate-200 space-y-2.5 shadow-xs">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-bold ${grp.badgeColor}">
                  ${grp.category[state.lang]}
                </span>
                <ul class="space-y-2">
                  ${grp.items
                    .map(
                      (feat) => `
                    <li>
                      <button onclick="${feat.action}" class="w-full text-left p-2.5 rounded-2xl bg-slate-50 hover:bg-blue-50 border border-slate-200 transition flex items-start gap-2.5">
                        <span class="w-2 h-2 rounded-full bg-blue-900 mt-1.5 shrink-0"></span>
                        <div class="flex-1 min-w-0">
                          <p class="text-xs font-bold text-slate-900">${feat.title[state.lang]}</p>
                          <p class="text-[11px] text-slate-600 leading-snug mt-0.5">${feat.desc[state.lang]}</p>
                        </div>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-blue-800 mt-1 shrink-0"></i>
                      </button>
                    </li>
                  `
                    )
                    .join("")}
                </ul>
              </div>
            `
              )
              .join("")}
          </div>
        `;
      }
    }
  </script>
</body>
</html>
